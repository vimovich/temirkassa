<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Temir Daftar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f3f5f7; --surface:#fff; --raised:#f2f8fd; --border:#e6e6e6; --rule:#f0f1f3; --control:#d6d9dd;
  --text:#1b1d1f; --muted:#5c6064; --faint:#a3a7ab; --accent:#1d5fd6; --accent-soft:#dcf1ff; --accent-ink:#0a3a80;
  --positive:#2f7a45; --negative:#c41c29; --plan-bar:#c9dcf7; --grid:#eceef0;
  --pill-pos-bg:#dcfae5; --pill-pos-ink:#04250e; --pill-warn-bg:#fff4e0; --pill-warn-ink:#7a3a06;
  --pill-neu-bg:#eef1f4; --pill-neu-ink:#3a3d40; --primary:#1b1d1f; --on-primary:#fff; --scrim:rgba(15,16,17,.42);
  --r-card:20px; --r-ctl:12px; --ease:cubic-bezier(.2,.8,.2,1);
}
html.dark{
  --ground:#0e0f10; --surface:#18191b; --raised:#1f2124; --border:#26282b; --rule:#222427; --control:#3a3d41;
  --text:#eceef0; --muted:#9a9fa5; --faint:#6b7076; --accent:#5b8ff0; --accent-soft:#16264a; --accent-ink:#b9d0ff;
  --positive:#5cc07d; --negative:#ff6b6b; --plan-bar:#2a3a58; --grid:#26282b;
  --pill-pos-bg:#14301e; --pill-pos-ink:#a6e8bb; --pill-warn-bg:#3a2a10; --pill-warn-ink:#ffcf87;
  --pill-neu-bg:#24262a; --pill-neu-ink:#c9cdd2; --primary:#eceef0; --on-primary:#0e0f10; --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ground)}
body{font-family:"Manrope",Inter,system-ui,sans-serif;color:var(--text);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom));position:relative}
.screen{display:none}
.screen.on{display:block;animation:in .34s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.top{display:flex;align-items:center;gap:10px;height:56px}
.top .sp{flex:1}
.mark{width:32px;height:32px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px;stroke:var(--on-primary)}
.brand{font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .15s}
.icon-btn:active{background:var(--rule)}
.back{margin-left:-8px;color:var(--text)}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
h2{font-size:18px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:14px} .xs{font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:20px}
.gap{margin-top:16px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px;gap:12px}
.link{color:var(--accent);font-size:14px;font-weight:600}

.total-label{font-size:14px;color:var(--muted);font-weight:500}
.total{font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:4px;word-break:break-word}
.total .cur{font-size:20px;color:var(--muted);font-weight:500;margin-left:4px}
.free{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;text-align:left}
.free b{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--positive);flex:none}
.dot.grey{background:var(--faint)}
.bar{height:8px;border-radius:8px;background:var(--rule);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--accent);transform-origin:left;animation:grow 1s var(--ease) both .1s}
@keyframes grow{from{transform:scaleX(0)}}
.bar-legend{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.bar-legend b{color:var(--text);font-weight:600}
.month-fig{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.month-fig span{font-size:15px;color:var(--muted);font-weight:500}

.btn{height:48px;border-radius:var(--r-ctl);padding:0 20px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--on-primary);width:100%}
.btn-ghost{background:var(--pill-neu-bg);color:var(--text)}
.btn-danger{background:transparent;color:var(--negative);width:100%}
.btn-sm{height:40px;padding:0 14px;font-size:14px}
.reminds{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{height:28px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;background:var(--pill-neu-bg);color:var(--pill-neu-ink)}
.chip.done{background:var(--pill-pos-bg);color:var(--pill-pos-ink)}
.chip.next{background:var(--accent-soft);color:var(--accent-ink)}

.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-key{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.chart-key span{display:inline-flex;align-items:center;gap:6px}
.chart-key i{width:10px;height:10px;border-radius:3px;display:inline-block}

.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;text-align:left;transition:opacity .15s}
.row+.row{border-top:1px solid var(--rule)}
.row:active{opacity:.6}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:600;font-size:16px;flex:none}
.row-main{flex:1;min-width:0;display:block}
.row-main>span{display:flex}
.row-top{justify-content:space-between;gap:8px;align-items:baseline}
.row-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{font-weight:600;white-space:nowrap}
.row-sub{justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:2px}
.row-sub>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub>span:last-child{flex:none}
.mini{display:block!important;height:4px;border-radius:4px;background:var(--rule);margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:grow .9s var(--ease) both .2s}
.pill{height:20px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn-ink)}
.pill.ok{background:var(--pill-pos-bg);color:var(--pill-pos-ink)}

.d-head{display:flex;gap:14px;align-items:center;margin-top:4px}
.d-head .av{width:56px;height:56px;border-radius:18px;font-size:20px}
.d-total{font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.1;word-break:break-word}
.d-eq{font-size:15px;color:var(--muted);margin-top:4px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border-radius:14px;overflow:hidden;margin-top:18px}
.facts div{background:var(--raised);padding:12px 14px}
.facts dt{font-size:13px;color:var(--muted)} .facts dd{font-weight:600;margin-top:2px}
.note{margin-top:14px;font-size:14px;color:var(--muted);white-space:pre-wrap}
.pay-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.pay-row+.pay-row{border-top:1px solid var(--rule)}
.pay-row .r{text-align:right;margin-left:auto}
.del{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--faint);flex:none}
.del:active{background:var(--rule)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--pill-neu-bg);border-radius:12px;padding:4px;gap:4px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg button{height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--text)}
.amount{font-size:32px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.amount span{font-size:18px;color:var(--muted);font-weight:500}
input[type=range]{width:100%;margin-top:16px;accent-color:var(--accent);height:28px}
.range-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.result{margin-top:18px;padding:16px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink)}
.result .big{font-size:22px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.strat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strat button{height:40px;padding:0 6px;border-radius:10px;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--border);transition:background .15s}
.strat button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.split-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.split-row+.split-row{border-top:1px solid var(--rule)}
.split-row .av{width:36px;height:36px;border-radius:12px;font-size:14px}
.split-amt{font-weight:600;text-align:right;white-space:nowrap}
.split-amt.zero{color:var(--muted);font-weight:500}
.why{font-size:13px;color:var(--muted)}
.sum-line{display:flex;justify-content:space-between;padding-top:12px;margin-top:4px;border-top:1px solid var(--border);font-weight:600}

.set-cap{font-size:14px;color:var(--muted);margin:24px 4px 8px}
.set-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:4px 16px}
.set-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 0;width:100%;text-align:left}
.set-row+.set-row{border-top:1px solid var(--rule)}
.set-row .t{flex:1;min-width:0}
.set-row .t b{display:block;font-weight:600;font-size:15px}
.set-row .t span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.set-row .v{font-size:14px;color:var(--muted);white-space:nowrap}
.chev{color:var(--faint);flex:none}
.sw{width:44px;height:26px;border-radius:13px;background:var(--control);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.sw.on{background:var(--positive)} .sw.on::after{transform:translateX(18px)}
.danger b{color:var(--negative)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}

.empty{text-align:center;padding:40px 12px 8px}
.empty h2{font-size:20px}
.empty p{color:var(--muted);margin:8px auto 20px;max-width:300px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow:auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s var(--ease);
  box-shadow:0 -8px 32px rgba(0,0,0,.12);max-width:480px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--control);margin:2px auto 14px}
.sheet h2{font-size:20px;margin-bottom:16px}
.field{margin-top:14px}
.field>label,.lbl{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-bottom:6px}
.in{width:100%;height:48px;border:1px solid var(--control);border-radius:12px;padding:0 14px;background:var(--surface);font-size:16px;outline:none;transition:border-color .15s}
.in:focus{border-color:var(--accent)}
textarea.in{height:auto;min-height:72px;padding:12px 14px;resize:none}
.in.big{font-size:22px;font-weight:600;height:56px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{font-size:13px;color:var(--negative);margin-top:10px;min-height:0}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--border);font-size:14px;font-weight:500}
.presets button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.hues{display:flex;gap:10px}
.hues button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:14px;outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s}
.hues button.on{outline-color:var(--text)}
.pick{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.pick button{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;text-align:left}
.pick button.on{background:var(--raised)}
.pick .av{width:36px;height:36px;border-radius:12px;font-size:14px}
.sheet-actions{margin-top:20px;display:grid;gap:8px}
.toggle-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;width:100%;text-align:left}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--primary);color:var(--on-primary);
  padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;transition:opacity .2s,transform .25s var(--ease);max-width:calc(100% - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{display:grid;place-items:center;min-height:70vh;color:var(--muted)}
.banner{background:var(--pill-warn-bg);color:var(--pill-warn-ink);border-radius:12px;padding:10px 14px;font-size:13px;margin-top:8px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;height:52px;justify-content:center;font-size:12px;font-weight:500;color:var(--muted);transition:color .15s}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--text)}
.nav button.on svg{stroke-width:2.1}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Загрузка…</div>

  <!-- HOME -->
  <section class="screen" id="s-home" aria-label="Главная">
    <div class="top">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h10.5a6 6 0 0 1 0 12H9V6"/></svg></div>
      <div class="brand">Temir Daftar</div><div class="sp"></div>
      <button class="icon-btn" aria-label="Новый долг" onclick="openDebtForm()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="demo-banner"></div>
    <div id="home-body"></div>
  </section>

  <!-- DEBTS -->
  <section class="screen" id="s-list" aria-label="Долги">
    <div class="top"><h1>Долги</h1><div class="sp"></div>
      <button class="btn btn-ghost btn-sm" onclick="openDebtForm()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Новый долг</button></div>
    <div id="list-body"></div>
  </section>

  <!-- DEBT -->
  <section class="screen" id="s-debt" aria-label="Долг">
    <div class="top">
      <button class="icon-btn back" aria-label="Назад" onclick="go(lastScreen||'list')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="sp"></div>
      <button class="icon-btn" aria-label="Изменить долг" onclick="openDebtForm(curDebt)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>
    </div>
    <div id="debt-body"></div>
  </section>

  <!-- PLAN -->
  <section class="screen" id="s-plan" aria-label="План">
    <div class="top"><h1>План выплат</h1></div>
    <div id="plan-body"></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="s-more" aria-label="Настройки">
    <div class="top"><h1>Настройки</h1></div>
    <div id="more-body"></div>
  </section>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast" role="status"></div>

<nav class="nav" aria-label="Разделы" id="nav" hidden><div class="nav-in">
  <button data-go="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button data-go="list" onclick="go('list')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Долги</button>
  <button data-go="plan" onclick="go('plan')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>План</button>
  <button data-go="more" onclick="go('more')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Настройки</button>
</div></nav>

<script>
'use strict';
const API = 'https://temir-kassa-api.vercel.app';
const TG = window.Telegram && Telegram.WebApp;
const INIT = TG && TG.initData || '';
const DEMO = !INIT;

/* ─── Formatting ─── */
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_IN = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const MSHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const usd = n => { const r = Math.round(n*100)/100; return '$' + (r%1 ? r.toFixed(2) : String(r)).replace(/\B(?=(\d{3})+(?!\d))/g,','); };
const money = (n, cur) => cur==='USD' ? usd(n) : fmt(n) + ' сум';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd = s => { const [y,m,d] = s.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const iso = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const dateRu = s => { const x = pd(s); return `${x.getDate()} ${MONTHS_G[x.getMonth()]} ${x.getFullYear()}`; };
const ym = x => x.getFullYear()*12 + x.getMonth();
const ymLabel = m => `${MONTHS_IN[m%12]} ${Math.floor(m/12)}`;
const plural = (n,a,b,c) => { const m=n%10,h=n%100; return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c; };
const parseNum = s => { const v = parseFloat(String(s).replace(/\s/g,'').replace(',','.')); return isFinite(v) ? v : NaN; };
const HUES = {
  blue:  ['#dcf1ff','#0a3a80','#1a2b45','#b9d0ff'], green:['#dcfae5','#14532d','#16301f','#a6e8bb'],
  amber: ['#ffefd6','#7a3a06','#3a2a10','#ffcf87'], rose: ['#ffe4ec','#8a1538','#3a1622','#ffb3c8'],
  teal:  ['#d5f5f2','#0f4f4a','#123330','#93e2d9'], violet:['#efe6ff','#4a2390','#2a1e40','#d3bfff'],
};
const hue = h => { const v = HUES[h] || HUES.blue; return document.documentElement.classList.contains('dark') ? [v[2], v[3]] : [v[0], v[1]]; };

/* ─── State ─── */
let S = { user:null, debts:[], today:new Date() };
let NOW_YM = 0, curDebt = null, lastScreen = 'home', screen = 'home';

function derive(raw){
  S.user = raw.user;
  S.today = pd(raw.today);
  NOW_YM = ym(S.today);
  S.debts = raw.debts.map(d => {
    const r = d.cur==='USD' ? d.rate : 1;
    const paidCur = d.payments.reduce((s,p)=>s+p.amount,0);
    const leftCur = Math.max(0, d.amount - paidCur);
    const spentUzs = d.payments.reduce((s,p)=>s + p.amount*(d.cur==='USD' ? (p.rate||d.rate) : 1),0);
    return {...d, paidCur, leftCur, amountUzs:d.amount*r, leftUzs:leftCur*r, spentUzs, closed:leftCur<=0.005};
  });
}
const openDebts = () => S.debts.filter(d=>!d.closed);
const totalLeft = () => S.debts.reduce((s,d)=>s+d.leftUzs,0);
const totalAll = () => S.debts.reduce((s,d)=>s+d.amountUzs,0);
const paidInMonth = m => S.debts.reduce((s,d)=>s + d.payments.filter(p=>ym(pd(p.date))===m).reduce((a,p)=>a+p.amount*(d.cur==='USD'?d.rate:1),0),0);
function freeMonth(monthly){
  let left = totalLeft();
  if (left <= .5) return NOW_YM;
  if (!(monthly > 0)) return null;
  left -= Math.max(0, monthly - paidInMonth(NOW_YM));
  let m = NOW_YM;
  while (left > .5){ m++; left -= monthly; if (m-NOW_YM > 600) return null; }
  return m;
}

/* ─── API ─── */
async function api(method, path, body){
  if (DEMO) return demoApi(method, path, body);
  const r = await fetch(API + path, { method, headers:{'Content-Type':'application/json','X-Init-Data':INIT}, body: body ? JSON.stringify(body) : undefined });
  let j = null; try { j = await r.json(); } catch(e) {}
  if (!r.ok){
    let msg = j && j.detail;
    if (Array.isArray(msg)) msg = 'Проверьте поля: ' + msg.map(e=>e.loc?.slice(-1)[0]).join(', ');
    throw new Error(msg || 'Нет связи с сервером');
  }
  return j;
}
async function reload(){
  derive(await api('GET','/api/state'));
  render();
}

/* ─── Theme ─── */
function applyTheme(){
  const pref = S.user?.theme || 'auto';
  const dark = pref==='dark' || (pref==='auto' && (TG?.colorScheme==='dark' || (!TG?.colorScheme && matchMedia('(prefers-color-scheme: dark)').matches)));
  document.documentElement.classList.toggle('dark', dark);
  try { TG?.setHeaderColor(dark ? '#0e0f10' : '#f3f5f7'); TG?.setBackgroundColor(dark ? '#0e0f10' : '#f3f5f7'); TG?.setBottomBarColor?.(dark ? '#18191b' : '#ffffff'); } catch(e){}
}

/* ─── Render ─── */
function render(){

  if (screen==='debt'){ const d = S.debts.find(x=>x.id===curDebt); d ? renderDebt(d.id) : go('list'); }

function rowHtml(x){
  const [bg,ink] = hue(x.hue);
  const pct = Math.round((x.amount - x.leftCur)/x.amount*100);
  let sub;
  if (x.closed) sub = `<span class="pill ok">закрыт</span>`;
  else if (x.due){
    const days = Math.round((pd(x.due)-S.today)/864e5), dd = pd(x.due);
    sub = days < 0 ? `<span class="pill warn">просрочен</span>` : days <= 45 ? `<span class="pill warn">до ${dd.getDate()} ${MSHORT[dd.getMonth()]}</span>` : `<span>до ${MONTHS_G[dd.getMonth()]} ${dd.getFullYear()}</span>`;
  } else sub = `<span>без срока</span>`;
  return `<button class="row" onclick="openDebt(${x.id})">
    <span class="av" style="background:${bg};color:${ink}">${esc(x.who.trim()[0]?.toUpperCase())}</span>
    <span class="row-main">
      <span class="row-top"><span class="row-name">${esc(x.who)}</span><span class="row-amt">${x.closed ? money(x.amount,x.cur) : money(x.leftCur,x.cur)}</span></span>
      <span class="row-sub"><span>${x.kind ? esc(x.kind)+' · ' : ''}${pct}%</span>${sub}</span>
      <span class="mini"><i style="width:${pct}%;background:${ink}"></i></span>
    </span></button>`;
}
const byDue = (a,b) => (a.due ? pd(a.due) : 8.64e15) - (b.due ? pd(b.due) : 8.64e15);

function emptyHtml(){

    <p>Кому и сколько должен, когда брал и к какому сроку хочешь отдать. Дальше я посчитаю план и буду напоминать.</p>

  let h = `<div class="card">

      h += `<div class="card gap">

        <div class="reminds">${r(10)}${r(20)}<span class="chip">${paidM>=plan?'План выполнен':'Осталось '+fmt(plan-paidM)}</span></div>
        <button class="btn btn-primary" style="margin-top:16px" onclick="openPayForm()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Отметить оплату</button>
      </div>`;
    } else {
      h += `<div class="card gap"><h2>Сколько готов отдавать в месяц?</h2>
        <p class="small muted" style="margin-top:6px">Задай сумму, и я посчитаю, когда закроешь все долги и как делить деньги.</p>
        <div class="two" style="margin-top:16px"><button class="btn btn-ghost" onclick="go('plan')">Задать план</button><button class="btn btn-primary" onclick="openPayForm()">Отметить оплату</button></div></div>`;
    }
  }
  const chart = chartSvg(plan);
  if (chart) h += `<div class="sec"><h2>Как уменьшается долг</h2></div>
    <div class="card" style="padding:18px 16px 14px"><div class="chart">${chart}</div>
    <div class="chart-key"><span><i style="background:var(--accent)"></i>Остаток в конце месяца</span>${plan>0&&left>.5?'<span><i style="background:var(--plan-bar)"></i>По плану</span>':''}</div></div>`;
  const od = openDebts().sort(byDue);
  if (od.length) h += `<div class="sec"><h2>Мои долги</h2><span class="muted small">${od.length} ${plural(od.length,'долг','долга','долгов')}</span></div>
    <div class="list">${od.map(rowHtml).join('')}</div>`;
  el.innerHTML = h;
}

function chartSvg(plan){
  if (!S.debts.length) return '';
  const firstYm = Math.min(...S.debts.map(d=>ym(pd(d.taken))));
  const startYm = Math.max(firstYm, NOW_YM - 5);
  const fm = freeMonth(plan);
  const endYm = fm===null ? NOW_YM : Math.min(fm, NOW_YM + 24);
  const pts = [];
  for (let m = startYm; m <= endYm; m++){
    let v;
    if (m <= NOW_YM){
      v = S.debts.reduce((s,d)=>{
        if (ym(pd(d.taken)) > m) return s;
        const paid = d.payments.filter(p=>ym(pd(p.date))<=m).reduce((a,p)=>a+p.amount,0);
        return s + Math.max(0, d.amount - paid)*(d.cur==='USD'?d.rate:1);
      },0);
    } else {
      const prev = pts[pts.length-1].v;
      const extra = m===NOW_YM+1 ? Math.max(0, plan - paidInMonth(NOW_YM)) : 0;
      v = Math.max(0, prev - plan - extra);
    }
    pts.push({m, v, plan: m > NOW_YM});
  }
  if (pts.length < 2) return '';
  const W=360,H=170,top=12,bot=26;
  const max = Math.max(...pts.map(p=>p.v)) || 1;
  const bw = W / pts.length, y = v => top + (H-top-bot)*(1 - v/max);
  const css = getComputedStyle(document.documentElement);
  const cA = css.getPropertyValue('--accent').trim(), cP = css.getPropertyValue('--plan-bar').trim(), cG = css.getPropertyValue('--grid').trim(), cM = css.getPropertyValue('--muted').trim(), cT = css.getPropertyValue('--text').trim();
  const maxLbl = max >= 1e6 ? (Math.round(max/1e5)/10).toString().replace('.',',') + ' млн' : fmt(max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Остаток долга по месяцам">`;
  [0.5,1].forEach(f=>{ const yy=y(max*f); s+=`<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="${cG}" stroke-dasharray="3 4"/>`; });
  s += `<text x="${W}" y="${y(max)-4}" text-anchor="end" font-size="11" fill="${cM}">${maxLbl}</text>`;
  const ni = NOW_YM - startYm, last = pts.length-1, step = pts.length > 14 ? 4 : 3;
  pts.forEach((p,i)=>{
    const x = i*bw + bw*0.18, w = bw*0.64, yy = y(p.v), hh = H-bot-yy;
    s += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hh,2).toFixed(1)}" rx="${Math.min(4,w/3).toFixed(1)}" fill="${p.plan?cP:cA}" style="transform-origin:${x}px ${H-bot}px;animation:bar .7s var(--ease) both ${Math.min(i*30,600)}ms"/>`;
    const show = p.m===NOW_YM || i===last || (Math.abs(i-ni)%step===0 && (last-i)>=2 && Math.abs(i-ni)>=step);
    if (show) s += `<text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${p.m===NOW_YM?cT:cM}" font-weight="${p.m===NOW_YM?600:400}">${p.m===NOW_YM?'сейчас':MSHORT[p.m%12]+(p.m%12===0?' '+String(Math.floor(p.m/12)).slice(2):'')}</text>`;
  });
  return s + `<style>@keyframes bar{from{transform:scaleY(0)}}</style></svg>`;
}

function renderList(){
  const el = document.getElementById('list-body');
  if (!S.debts.length){ el.innerHTML = emptyHtml(); return; }
  const od = openDebts().sort(byDue), cd = S.debts.filter(d=>d.closed);
  let h = od.length ? `<div class="list">${od.map(rowHtml).join('')}</div>` : `<div class="card empty"><h2>Открытых долгов нет</h2><p>Все долги закрыты. Так держать.</p></div>`;
  if (cd.length) h += `<div class="sec" id="closed"><h2>Закрытые</h2><span class="muted small">${cd.length}</span></div><div class="list">${cd.map(rowHtml).join('')}</div>`;
  el.innerHTML = h;
}

function openDebt(id){ curDebt = id; renderDebt(id); go('debt'); }
function renderDebt(id){
  const x = S.debts.find(v=>v.id===id); if (!x) return;
  const [bg,ink] = hue(x.hue), isUsd = x.cur==='USD';
  const pct = Math.round((x.amount-x.leftCur)/x.amount*100);
  let perMonth = null;
  if (x.fixed) perMonth = x.fixed;
  else if (x.due && !x.closed){ const ml = Math.max(1, ym(pd(x.due)) - NOW_YM + 1); perMonth = x.leftCur / ml; }
  const pays = x.payments.slice().reverse().map(p => `
    <div class="pay-row"><div><div style="font-weight:600">${money(p.amount,x.cur)}</div><div class="xs muted">${dateRu(p.date)}</div></div>
      <div class="r small muted">${isUsd ? fmt(p.amount*(p.rate||x.rate))+' сум<br><span class="xs">по курсу '+fmt(p.rate||x.rate)+(p.rate?'':' (взятия)')+'</span>' : ''}</div>
      <button class="del" aria-label="Удалить платёж" onclick="confirmDelPay(${p.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join('');
  document.getElementById('debt-body').innerHTML = `
    <div class="d-head"><span class="av" style="background:${bg};color:${ink}">${esc(x.who.trim()[0]?.toUpperCase())}</span>
      <div style="min-width:0"><h1 style="overflow-wrap:anywhere">${esc(x.who)}</h1><div class="small muted">${x.kind?esc(x.kind)+' · ':''}взял ${dateRu(x.taken)}</div></div></div>
    <div class="card" style="margin-top:20px">
      <div class="small muted">${x.closed ? 'Долг закрыт' : 'Осталось отдать'}</div>
      <div class="d-total">${money(x.closed ? x.amount : x.leftCur, x.cur)}</div>
      ${isUsd && !x.closed ? `<div class="d-eq">≈ ${fmt(x.leftUzs)} сум по курсу, когда брал (${fmt(x.rate)})</div>` : ''}
      <div class="bar"><i style="width:${pct}%;background:${ink}"></i></div>
      <div class="bar-legend"><span>Отдано <b>${money(x.paidCur,x.cur)}</b></span><span>${pct}% от ${money(x.amount,x.cur).replace(' сум','')}</span></div>
      <dl class="facts">
        <div><dt>Закрыть до</dt><dd>${x.due ? dateRu(x.due) : 'Без срока'}</dd></div>
        <div><dt>${x.fixed ? 'Платёж '+(x.pay_day? x.pay_day+'-го':'в месяц') : 'Нужно в месяц'}</dt><dd>${perMonth!==null && !x.closed ? money(perMonth,x.cur) : '—'}</dd></div>
        ${isUsd ? `<div><dt>Брал по курсу</dt><dd>${fmt(x.rate)} сум</dd></div><div><dt>Потратил сумов</dt><dd>${fmt(x.spentUzs)}</dd></div>`
                : `<div><dt>Брал</dt><dd>${fmt(x.amount)} сум</dd></div><div><dt>Платежей</dt><dd>${x.payments.length}</dd></div>`}
      </dl>
      ${x.note ? `<div class="note">${esc(x.note)}</div>` : ''}
      ${x.closed ? '' : `<button class="btn btn-primary" style="margin-top:18px" onclick="openPayForm(${x.id})">Отметить оплату</button>`}
    </div>
    <div class="sec"><h2>Платежи</h2><span class="small muted">${x.payments.length}</span></div>
    ${x.payments.length ? `<div class="list">${pays}</div>` : `<div class="card small muted">Платежей пока нет. Нажми «Отметить оплату», когда отдашь часть.</div>`}`;
}

/* ─── Plan ─── */
let planMode = 'amount', planDraft = null, target = null;
const STRATS = {small:'Мелкие', urgent:'Срочные', even:'Поровну'};
function setMode(m){ planMode = m; renderPlan(); }
function renderPlan(){
  const el = document.getElementById('plan-body');
  if (!openDebts().length){ el.innerHTML = S.debts.length ? `<div class="card empty"><h2>Планировать нечего</h2><p>Все долги закрыты.</p></div>` : emptyHtml(); return; }
  if (planDraft===null) planDraft = S.user.monthly_plan || 0;
  const left = totalLeft();
  const maxR = Math.max(1_000_000, Math.ceil(left/1_000_000)*1_000_000);
  const stepR = maxR > 50_000_000 ? 500_000 : maxR > 10_000_000 ? 250_000 : 50_000;
  let h = `<div class="seg"><button class="${planMode==='amount'?'on':''}" onclick="setMode('amount')">Могу отдавать</button><button class="${planMode==='date'?'on':''}" onclick="setMode('date')">Закрыть к дате</button></div>`;
  if (planMode==='amount'){
    const v = planDraft || Math.round(maxR/10/stepR)*stepR;
    if (!planDraft) planDraft = v;
    h += `<div class="card gap"><label for="rng" class="small muted">Сколько готов отдавать в месяц</label>
      <div class="amount" id="p-amt">${fmt(v)} <span>сум</span></div>
      <input id="rng" type="range" min="${stepR}" max="${maxR}" step="${stepR}" value="${Math.min(v,maxR)}" oninput="planDraft=+this.value;updAmt()">
      <div class="range-ends"><span>${fmt(stepR)}</span><span>${fmt(maxR)}</span></div>
      <button class="link" style="margin-top:8px" onclick="askAmount()">Ввести точную сумму</button>
      <div class="result"><div class="small">Свободен от долгов</div><div class="big" id="p-free"></div><div class="small" id="p-free-sub" style="margin-top:2px"></div></div>
      <button class="btn btn-primary" id="p-save" style="margin-top:16px" onclick="savePlan()">Сохранить план</button></div>`;
  } else {
    if (!target){ const t = new Date(S.today.getFullYear(), S.today.getMonth()+12, 1); target = iso(t).slice(0,7); }
    const [Y,M] = target.split('-').map(Number), months = Math.max(0, (Y*12+M-1) - NOW_YM);
    const need = Math.ceil((left + paidInMonth(NOW_YM)) / (months+1) / 1000)*1000;
    h += `<div class="card gap"><label for="tgt" class="small muted">Хочу закрыть все долги к</label>
      <input id="tgt" class="in big" type="month" value="${target}" min="${iso(S.today).slice(0,7)}" onchange="target=this.value||target;renderPlan()" style="margin-top:8px">
      <div class="result"><div class="small">Нужно отдавать в месяц</div><div class="big">${fmt(need)} сум</div>
      <div class="small" style="margin-top:2px">${months+1} ${plural(months+1,'месяц','месяца','месяцев')}, включая ${MONTHS[S.today.getMonth()]}</div></div>
      <button class="btn btn-primary" style="margin-top:16px" onclick="planDraft=${need};savePlan()">Сделать это планом</button></div>`;
  }
  h += `<div class="sec" style="flex-direction:column;align-items:flex-start;gap:2px"><h2 id="p-split-title"></h2><span class="small muted">Что гасить в первую очередь</span></div>
    <div class="strat">${Object.entries(STRATS).map(([k,v])=>`<button class="${k===(S.user.strategy||'small')?'on':''}" onclick="setStrategy('${k}')">${v}</button>`).join('')}</div>
    <div class="card" style="margin-top:12px;padding:8px 16px 16px" id="p-split"></div>`;
  el.innerHTML = h;
  if (planMode==='amount') updAmt(); else renderSplit(S.user.monthly_plan || 0);
}
function updAmt(){
  const a = document.getElementById('p-amt'); if (!a) return;
  a.innerHTML = `${fmt(planDraft)} <span>сум</span>`;
  const fm = freeMonth(planDraft);
  document.getElementById('p-free').textContent = fm===null ? 'больше чем через 50 лет' : 'в ' + ymLabel(fm);
  document.getElementById('p-free-sub').textContent = fm===null ? 'Увеличь сумму' : (fm-NOW_YM===0 ? 'в этом месяце' : `через ${fm-NOW_YM} ${plural(fm-NOW_YM,'месяц','месяца','месяцев')}`);
  const btn = document.getElementById('p-save'); const same = planDraft === (S.user.monthly_plan||0);
  btn.disabled = same; btn.textContent = same ? 'Это текущий план' : 'Сохранить план';
  renderSplit(planDraft);
}
function askAmount(){
  openSheet(`<h2>Сумма в месяц</h2><div class="field"><input class="in big" id="f-plan" inputmode="numeric" value="${fmt(planDraft||0)}" oninput="liveFmt(this)"></div>
    <div class="sheet-actions"><button class="btn btn-primary" onclick="const v=parseNum(document.getElementById('f-plan').value);if(v>0){planDraft=Math.round(v);closeSheet();renderPlan();}">Готово</button></div>`, 'f-plan');
}

function split(monthly, monthYm){
  let pool = monthly; const alloc = {}, why = {};
  const od = openDebts(); od.forEach(d=>alloc[d.id]=0);
  for (const d of od) if (d.fixed){
    const r = d.cur==='USD'?d.rate:1;
    const paidThis = d.payments.filter(p=>ym(pd(p.date))===monthYm).reduce((s,p)=>s+p.amount,0);
    const need = Math.max(0, d.fixed - paidThis) * r;
    const a = Math.min(need, d.leftUzs, pool); alloc[d.id]+=a; pool-=a;
    why[d.id] = paidThis >= d.fixed ? 'Платёж этого месяца уже внесён' : d.pay_day ? `Ежемесячный платёж ${d.pay_day}-го` : 'Ежемесячный платёж'; }
  let rest = od.filter(d=>!d.fixed);
  const st = S.user.strategy || 'small';
  if (st==='even'){
    while (pool > 1 && rest.length){
      const share = Math.max(1000, Math.floor(pool/rest.length/1000)*1000);
      for (const d of rest){ const a = Math.min(share, d.leftUzs-alloc[d.id], pool); alloc[d.id]+=a; pool-=a; }
      rest = rest.filter(d=>d.leftUzs-alloc[d.id] > .5);
    }
  } else {
    rest.sort(st==='small' ? (a,b)=>a.leftUzs-b.leftUzs : byDue);
    for (const d of rest){ const a = Math.min(pool, d.leftUzs-alloc[d.id]); alloc[d.id]+=a; pool-=a; }
  }
  for (const d of od) if (!why[d.id] && alloc[d.id] > .5) why[d.id] = alloc[d.id] >= d.leftUzs-.5 ? 'Закроешь полностью' : st==='small' ? 'Самый маленький остаток' : st==='urgent' ? (d.due ? 'Ближайший срок' : 'Остаток суммы') : 'Поровну';
  return {alloc, why, rest:pool};
}
function renderSplit(monthly){
  const nextM = (paidInMonth(NOW_YM) >= monthly && monthly>0) ? NOW_YM+1 : NOW_YM;
  const amount = nextM===NOW_YM ? Math.max(0, monthly - paidInMonth(NOW_YM)) : monthly;
  document.getElementById('p-split-title').textContent = nextM===NOW_YM ? `Как разделить остаток ${MONTHS_G[nextM%12]}` : `Как разделить в ${MONTHS_IN[nextM%12]}`;
  const box = document.getElementById('p-split');
  if (!(monthly > 0)){ box.innerHTML = `<p class="small muted" style="padding:10px 0 0">Задай сумму в месяц, и здесь появится, кому и сколько отдать.</p>`; return; }
  const {alloc, why} = split(amount, nextM);
  const od = openDebts().sort(byDue);
  const total = od.reduce((s,d)=>s+alloc[d.id],0);
  box.innerHTML = od.map(x=>{
    const [bg,ink] = hue(x.hue), a = alloc[x.id];
    const note = x.cur==='USD' && a>0 ? ` · ≈ ${usd(a/x.rate)}` : '';
    return `<div class="split-row"><span class="av" style="background:${bg};color:${ink}">${esc(x.who.trim()[0]?.toUpperCase())}</span>
      <div style="flex:1;min-width:0"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.who)}</div><div class="why">${a>.5 ? why[x.id]+note : (why[x.id] || 'В этом месяце не трогаем')}</div></div>
      <div class="split-amt ${a>.5?'':'zero'}">${a>.5?fmt(a):'0'}</div></div>`;
  }).join('') + `<div class="sum-line"><span>Всего</span><span>${fmt(total)} сум</span></div>`;
}

let sheetOpen = false;
function openSheet(html, focusId){
  document.getElementById('sheet-body').innerHTML = html;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  sheetOpen = true; syncBack();

function closeSheet(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');

function liveFmt(el){
  const raw = el.value.replace(/[^\d.,]/g,'');
  const [i, f] = raw.split(/[.,]/);
  el.value = (i||'').replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,' ') + (f!==undefined ? ','+f.slice(0,2) : '');
}

/* debt form */

function openDebtForm(id){

  F = d ? {...d} : {cur:'UZS', hue:Object.keys(HUES).find(h=>!used.has(h)) || 'blue', taken:iso(S.today), kind:'', fixedOn:false};

const fmtIn = n => { const s = String(Math.round(n*100)/100).split('.'); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ') + (s[1] ? ','+s[1] : ''); };
function rateHint(){
  const h = document.getElementById('rate-hint'); if (!h) return;
  const a = parseNum(document.getElementById('f-amount').value), r = parseNum(document.getElementById('f-rate').value);
  h.textContent = a>0 && r>0 ? `= ${fmt(a*r)} сум на момент взятия` : '';
}
function syncForm(){
  const v = id => document.getElementById(id)?.value;
  if (!document.getElementById('f-who')) return;
  F.who = v('f-who'); const k = v('f-kind'); if (k) F.kind = k.trim();
  F.amount = parseNum(v('f-amount')); if (document.getElementById('f-rate')) F.rate = parseNum(v('f-rate'));
  F.taken = v('f-taken'); F.due = v('f-due') || null; F.note = v('f-note');
  if (document.getElementById('f-fixed')){ F.fixed = parseNum(v('f-fixed')); F.pay_day = parseInt(v('f-day')) || null; }
}
async function saveDebt(edit){
  syncForm();
  const err = m => { document.getElementById('f-err').textContent = m; haptic('error'); };
  if (!F.who || !F.who.trim()) return err('Напиши, кому должен');
  if (!(F.amount > 0)) return err('Укажи сумму долга');
  if (F.cur==='USD' && !(F.rate > 0)) return err('Укажи курс, по которому брал доллары');
  if (!F.taken) return err('Укажи, когда брал');
  if (F.due && F.due < F.taken) return err('Срок не может быть раньше даты взятия');
  if (F.fixedOn && !(F.fixed > 0)) return err('Укажи сумму ежемесячного платежа');
  if (F.fixedOn && F.pay_day && (F.pay_day < 1 || F.pay_day > 31)) return err('Число месяца — от 1 до 31');
  const body = {who:F.who.trim(), kind:(F.kind||'').trim(), cur:F.cur, amount:F.amount, rate:F.cur==='USD'?F.rate:null,
    taken:F.taken, due:F.due||null, fixed:F.fixedOn?F.fixed:null, pay_day:F.fixedOn?(F.pay_day||null):null, hue:F.hue, note:(F.note||'').trim()};
  const b = document.getElementById('f-save'); b.disabled = true;
  try {
    const r = edit ? await api('PUT','/api/debts/'+F.id, body) : await api('POST','/api/debts', body);
    closeSheet(); haptic('success'); toast(edit ? 'Сохранено' : 'Долг добавлен'); planDraft = null;
    await reload(); if (!edit) openDebt(r.id);
  } catch(e){ b.disabled = false; err(e.message); }
}

  } else {
    h += `<div class="field"><label for="p-uzs">Сколько отдал, сум</label><input class="in big" id="p-uzs" inputmode="decimal" placeholder="0" value="${P.uzs?fmtIn(P.uzs):''}" oninput="liveFmt(this);payHint()"></div>

  }

    <div class="field"><label for="p-date">Когда</label><input class="in" id="p-date" type="date" value="${P.date}" max="${iso(S.today)}"></div>
    <div class="presets" style="margin-top:12px">${d.fixed?`<button onclick="fillPay(${d.fixed})">Ежемесячный платёж</button>`:''}<button onclick="fillPay(${d.leftCur})">Весь остаток</button></div>

  openSheet(h, (!usdDebt || P.mode==='cur') ? 'p-amount' : 'p-uzs');

function syncPay(){
  const g = id => document.getElementById(id);
  if (g('p-amount')) P.amount = parseNum(g('p-amount').value);
  if (g('p-uzs')) P.uzs = parseNum(g('p-uzs').value);
  if (g('p-rate')) P.rate = parseNum(g('p-rate').value);
  if (g('p-date')) P.date = g('p-date').value;
}
function payHint(){
  const d = S.debts.find(x=>x.id===P.debt_id), h = document.getElementById('p-hint'); if (!d || !h) return;
  syncPay();
  if (d.cur!=='USD'){ h.textContent = P.amount > 0 ? `Останется ${fmt(Math.max(0, d.leftCur-P.amount))} сум` : ''; return; }
  if (P.mode==='uzs'){ h.textContent = P.uzs>0 && P.rate>0 ? `= ${usd(P.uzs/P.rate)} · останется ${usd(Math.max(0,d.leftCur-P.uzs/P.rate))}` : ''; }
  else h.textContent = P.amount>0 ? `${P.rate>0 ? '= '+fmt(P.amount*P.rate)+' сум · ' : ''}останется ${usd(Math.max(0,d.leftCur-P.amount))}` : '';
}
async function savePay(){
  syncPay();
  const d = S.debts.find(x=>x.id===P.debt_id);
  const err = m => { document.getElementById('p-err').textContent = m; haptic('error'); };
  let amount = P.amount, rate = null;
  if (d.cur==='USD'){
    if (P.mode==='uzs'){ if (!(P.uzs>0)) return err('Укажи сумму в сумах'); if (!(P.rate>0)) return err('Укажи курс доллара в этот день'); amount = Math.round(P.uzs/P.rate*100)/100; rate = P.rate; }
    else rate = P.rate > 0 ? P.rate : null;
  }
  if (!(amount > 0)) return err('Укажи сумму');
  if (amount > d.leftCur + 0.01) return err(`Это больше остатка: ${money(d.leftCur,d.cur)}`);
  if (!P.date) return err('Укажи дату');
  const b = document.getElementById('p-save'); b.disabled = true;
  try {
    await api('POST','/api/payments',{debt_id:d.id, date:P.date, amount, rate});
    closeSheet(); haptic('success');
    toast(amount >= d.leftCur - 0.01 ? `Долг «${d.who}» закрыт полностью` : 'Платёж записан');
    await reload();
  } catch(e){ b.disabled = false; err(e.message); }
}
function confirmDelPay(id){
  openSheet(`<h2>Удалить платёж?</h2><p class="muted">Сумма вернётся в остаток долга.</p>
    <div class="sheet-actions"><button class="btn btn-primary" style="background:var(--negative);color:#fff" onclick="delPay(${id})">Удалить</button><button class="btn btn-ghost" onclick="closeSheet()">Отмена</button></div>`);
}
async function delPay(id){
  try { await api('DELETE','/api/payments/'+id); closeSheet(); toast('Платёж удалён'); await reload(); } catch(e){ toast(e.message); }
}

/* ─── Navigation & Telegram ─── */
function go(s){
  if (s!=='debt') lastScreen = s;
  screen = s;
  document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on', e.id==='s-'+s));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.go===(s==='debt'?'list':s)));
  window.scrollTo(0,0); syncBack();
}
function syncBack(){
  if (!TG?.BackButton) return;
  (sheetOpen || screen==='debt') ? TG.BackButton.show() : TG.BackButton.hide();
}
function onBack(){ if (sheetOpen) closeSheet(); else if (screen==='debt') go(lastScreen||'list'); }
function haptic(t){ try { if (t==='light') TG.HapticFeedback.impactOccurred('light'); else TG.HapticFeedback.notificationOccurred(t); } catch(e){} }
let toastT;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2600); }

/* ─── Start ─── */
async function start(){
  if (TG){ try { TG.ready(); TG.expand(); TG.disableVerticalSwipes?.(); TG.BackButton.onClick(onBack); TG.onEvent('themeChanged', applyTheme); } catch(e){} }
  try { await reload(); }
  catch(e){
    document.getElementById('loading').innerHTML = `<div style="text-align:center;padding:0 24px"><h2>Не удалось загрузить</h2><p class="muted" style="margin:8px 0 16px">${esc(e.message)}</p><button class="btn btn-primary" onclick="location.reload()">Попробовать снова</button></div>`;
    return;
  }
  document.getElementById('loading').remove();
  document.getElementById('nav').hidden = false;
  if (DEMO) document.getElementById('demo-banner').innerHTML = `<div class="banner">Демо с примерными данными. Откройте приложение через бота в Telegram, чтобы увидеть свои долги.</div>`;
  const h = (location.hash||'').slice(1);
  if (h==='pay'){ go('home'); openPayForm(); }
  else if (h.startsWith('debt-') && S.debts.some(d=>d.id===+h.slice(5))){ lastScreen='list'; openDebt(+h.slice(5)); openPayForm(+h.slice(5)); }
  else go(['list','plan','more'].includes(h) ? h : 'home');
}
start();
